  <style>
    html,body{height:100%}
    .find-us-wrapper{display:flex;flex-direction:column;height:100%;padding-top:var(--header-h)}
    .find-us-main{display:flex;flex:1;min-height:0}
    .filter-panel{width:380px;min-width:380px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;z-index:10}
    .filter-header{padding:28px 28px 20px;border-bottom:1px solid var(--border)}
    .filter-header h2{font-size:22px;font-weight:800;letter-spacing:.02em;margin-bottom:4px;color:var(--text)}
    .filter-header p{font-size:13px;color:var(--text3)}
    .filter-group{padding:18px 28px;border-bottom:1px solid var(--border)}
    .filter-group h3{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--text3);margin-bottom:12px}
    .filter-chips{display:flex;flex-wrap:wrap;gap:8px}
    .filter-chip{padding:6px 16px;font-size:12px;font-weight:500;border:1px solid rgba(0,0,0,.12);border-radius:980px;background:transparent;cursor:pointer;transition:all .25s;font-family:inherit;color:var(--text2)}
    .filter-chip:hover{border-color:var(--text);color:var(--text)}
    .filter-chip.active{background:var(--text);color:#fff;border-color:var(--text)}
    .store-count{font-size:12px;color:var(--text3);padding:0 28px;margin:8px 0}
    .store-list{flex:1;overflow-y:auto}
    .store-card{padding:16px 28px;cursor:pointer;transition:all .2s;border-left:3px solid transparent}
    .store-card:hover{background:var(--bg-gray)}
    .store-card.active{background:var(--bg-gray);border-left-color:var(--text)}
    .store-card h4{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--text)}
    .store-card .brand-tag{display:inline-block;padding:2px 10px;font-size:10px;font-weight:600;border-radius:980px;margin-bottom:5px;color:#fff;letter-spacing:.04em}
    .store-card p{font-size:12px;color:var(--text2);line-height:1.5}
    .store-card .store-detail{font-size:11px;color:var(--text3);margin-top:3px}
    .map-wrap{flex:1;position:relative;min-height:0}
    #map{width:100%;height:100%}
    #map img{pointer-events:auto!important}
    .leaflet-container{background:#f8f8f8!important}
    .leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 4px 20px rgba(0,0,0,.12)!important}
    .leaflet-popup-content{margin:14px 18px!important;font-family:var(--font)!important;font-size:13px!important}
    .map-legend{position:absolute;bottom:20px;left:20px;background:var(--bg);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow);font-size:11px;display:flex;flex-wrap:wrap;gap:10px;z-index:1000}
    .legend-dot{display:inline-flex;align-items:center;gap:5px}
    .legend-dot span{width:10px;height:10px;border-radius:50%;display:inline-block}
    @media(max-width:734px){
      .find-us-main{flex-direction:column}
      .filter-panel{width:100%;min-width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
      .map-wrap{flex:1;height:60vh;min-height:300px}
      .filter-header{padding:20px 20px 16px}.filter-group{padding:14px 20px}.store-card{padding:14px 20px}
    }
  </style>

  const brandColors={'九十葉':'#5A7A4B','BLACKTREE':'#2C241E','Matcha Wang':'#4A7A3B','Yoajung':'#6BA3D6','抹趣':'#4A8C5C','lemonwell':'#C8B830'};
  let activeBrand='all',activeCity='all',map,markers=[];

  function initMap(){
    // Wait for container to have dimensions
    var container=document.getElementById('map');
    if(!container||container.offsetHeight===0){setTimeout(initMap,100);return}

    map=L.map('map',{
      zoomControl:true,
      scrollWheelZoom:true
    }).setView([32.0,116.0],6);

    // 高德地图中文瓦片（国内访问无障碍）
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
      attribution:'&copy; 高德地图',
      maxZoom:18,
      subdomains:['1','2','3','4']
    }).addTo(map);

    renderStores();
  }

  function renderStores(){
    markers.forEach(function(m){map.removeLayer(m)});markers=[];
    var filtered=S.filter(function(s){return(activeBrand==='all'||s.b===activeBrand)&&(activeCity==='all'||s.c===activeCity)});

    var list=document.getElementById('store-list');
    list.innerHTML=filtered.map(function(s,i){return'<div class="store-card" data-i="'+i+'" onclick="window._focusStore('+i+')"><span class="brand-tag" style="background:'+brandColors[s.b]+'">'+s.b+'</span><h4>'+s.n+'</h4><p>'+s.a+'</p><div class="store-detail">'+s.d+'</div></div>'}).join('');

    document.getElementById('store-count').textContent='共 '+filtered.length+' 家门店';

    var bounds=[];
    filtered.forEach(function(s){
      var m=L.marker([s.la,s.lo],{
        icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:'+brandColors[s.b]+';border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',iconSize:[16,16],iconAnchor:[8,8]})
      }).addTo(map);
      m.bindPopup('<div style="font-family:-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif;font-size:13px;line-height:1.5"><strong style="font-size:14px">'+s.n+'</strong><br>'+s.a+'<br><span style="color:#86868B;font-size:11px">'+s.d+'</span></div>');
      markers.push(m);bounds.push([s.la,s.lo]);
    });

    if(bounds.length)map.flyToBounds(bounds,{padding:[50,50],maxZoom:13,duration:1});
  }

  window._focusStore=function(idx){
    var filtered=S.filter(function(s){return(activeBrand==='all'||s.b===activeBrand)&&(activeCity==='all'||s.c===activeCity)});
    if(idx>=0&&idx<filtered.length){
      var s=filtered[idx];
      map.flyTo([s.la,s.lo],16,{duration:.8});
      var cards=document.querySelectorAll('.store-card');
      cards.forEach(function(c){c.classList.remove('active')});
      if(cards[idx]){cards[idx].classList.add('active');cards[idx].scrollIntoView({behavior:'smooth',block:'nearest'})}
    }
  };

  function setupFilters(id,setter){
    document.getElementById(id).addEventListener('click',function(e){
      var chip=e.target.closest('.filter-chip');if(!chip)return;
      var btns=document.querySelectorAll('#'+id+' .filter-chip');
      for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
      chip.classList.add('active');setter(chip.dataset.filter);renderStores();
    });
  }

  // Start when DOM is ready, after site.js has run
  if(document.readyState==='complete'){initMap()}else{window.addEventListener('load',initMap)}
  setupFilters('brand-filters',function(v){activeBrand=v});
  setupFilters('city-filters',function(v){activeCity=v});
})();
